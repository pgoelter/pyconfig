name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tidyconf/
    permissions:
      id-token: write # trusted publishing: PyPI accepts this workflow without an API token
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Check that the tag matches the package version
        run: grep -qx "__version__ = \"${GITHUB_REF_NAME#v}\"" tidyconf/__init__.py
      - run: uv build
      # Uploads dist/ and generates signed provenance attestations (PEP 740).
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
